<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8eef0;--board:#b9c7cc;--cell:#d3dde0;--text:#1d2b30;--muted:#5a6d74;--btn:#1f5f6b;--btnt:#fff;
  --t2:#ffe66d;--t4:#ffc145;--t8:#ff9f1c;--t16:#ff6b4a;--t32:#f72585;--t64:#c1189b;
  --t128:#7b2cbf;--t256:#4361ee;--t512:#1ea5d4;--t1024:#06b886;--t2048:#f5a800;--tmax:#222;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14201f;--board:#27393a;--cell:#334849;--text:#e8f0ee;--muted:#9bb0ad;--btn:#4fb0a6;--btnt:#0f1a1a;}
}
:root[data-theme="dark"]{--bg:#14201f;--board:#27393a;--cell:#334849;--text:#e8f0ee;--muted:#9bb0ad;--btn:#4fb0a6;--btnt:#0f1a1a;}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;justify-content:center;align-items:center;touch-action:none}
.wrap{width:min(92vw,420px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:44px;margin:0;letter-spacing:-1px}
.scores{display:flex;gap:8px}
.score{background:var(--board);border-radius:8px;padding:6px 12px;text-align:center;min-width:56px}
.score small{display:block;font-size:11px;color:var(--muted)}
.score b{font-size:18px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
button{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:bold;cursor:pointer}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
#revive{background:#f5a800;color:#1d2b30}#revive[disabled]{opacity:.5;cursor:default}#err{font-size:14px;font-weight:normal;color:#b3261e;min-height:18px}
#board{position:relative;background:var(--board);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;aspect-ratio:1}
.cell{background:var(--cell);border-radius:8px}
.tile{position:absolute;z-index:1;box-shadow:0 3px 8px rgba(0,0,0,.22),inset 0 -3px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold;color:var(--text);
  transition:left .12s,top .12s;font-size:clamp(20px,7vw,34px)}
.tile.new{animation:pop .15s}
.tile.merged{animation:bump .2s}@keyframes bump{50%{transform:scale(1.22)}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.tile.big{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#lbPanel{position:absolute;inset:0;z-index:30;border-radius:12px;background:var(--bg);display:none;flex-direction:column;padding:14px;gap:10px;overflow:auto;color:var(--text)}#lbPanel.show{display:flex}#lbPanel h2{margin:0;font-size:22px}#lbList{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}#lbList li{display:flex;justify-content:space-between;gap:10px;background:var(--board);border-radius:8px;padding:6px 10px}#lbList li.me{outline:2px solid var(--btn)}.sm{padding:6px 10px;font-size:13px}
#msg{position:absolute;inset:0;z-index:20;border-radius:12px;background:rgba(232,238,240,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:28px;font-weight:bold;color:#1d2b30}
#msg.show{display:flex}
@media (prefers-reduced-motion:reduce){.tile,.tile.new,.tile.merged{transition:none;animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><small>Счёт</small><b id="score">0</b></div>
      <div class="score"><small>Рекорд</small><b id="best">0</b></div>
    </div>
  </header>
  <div class="bar"><span>Стрелки или свайп</span><span><button id="lb" class="sm">Лидеры</button> <button id="restart">Заново</button></span></div>
  <div id="board"><div id="lbPanel"><h2>Лидеры</h2><ol id="lbList"></ol><button id="lbClose">Закрыть</button></div><div id="msg"><span id="msgText"></span><button id="revive">Возродиться за 100 монэток</button><span id="err"></span><button id="again">Играть снова</button></div></div>
</div>
<script src="https://huevo.su/static/js/huevo-apps-v1.js"></script>
<script>
const N=4;
let grid,score,best=0,over=false,won=false,keepGoing=false;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const msg=document.getElementById('msg'),msgText=document.getElementById('msgText');
try{best=+localStorage.getItem('best2048')||0}catch(e){}

for(let i=0;i<N*N;i++){const c=document.createElement('div');c.className='cell';boardEl.appendChild(c)}

function colorFor(v){
  const m={2:'--t2',4:'--t4',8:'--t8',16:'--t16',32:'--t32',64:'--t64',128:'--t128',256:'--t256',512:'--t512',1024:'--t1024',2048:'--t2048'};
  return 'var('+(m[v]||'--tmax')+')';
}
let nextId=1;const els=new Map();
function geo(){const z=(boardEl.clientWidth-50)/4; return {z,x:c=>10+c*(z+10),y:r=>10+r*(z+10)}}
function styleEl(el,v,z){
  el.textContent=v;el.className='tile'+(v>=8?' big':'');
  el.style.background=colorFor(v);el.style.fontSize=v>=1024?'clamp(16px,5.5vw,26px)':'';
  el.style.width=el.style.height=z+'px';
}
function init(){
  grid=Array.from({length:N},()=>Array(N).fill(null));
  els.forEach(e=>e.remove());els.clear();
  score=0;over=false;won=false;keepGoing=false;
  msg.classList.remove('show');
  addTile();addTile();render();
}
function addTile(){
  const e=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);
  if(!e.length)return;
  const [r,c]=e[Math.floor(Math.random()*e.length)];
  grid[r][c]={id:nextId++,v:Math.random()<.9?2:4,fresh:true};
}
function render(){
  const g=geo();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t=grid[r][c];if(!t)continue;
    let el=els.get(t.id);
    if(!el){
      el=document.createElement('div');els.set(t.id,el);boardEl.appendChild(el);
      styleEl(el,t.v,g.z);
      el.style.left=g.x(c)+'px';el.style.top=g.y(r)+'px';
      if(t.fresh){el.classList.add('new');t.fresh=false}
    }
    el.style.width=el.style.height=g.z+'px';
    el.style.left=g.x(c)+'px';el.style.top=g.y(r)+'px';
  }
  scoreEl.textContent=score;
  if(score>best){best=score;try{localStorage.setItem('best2048',best)}catch(e){}}
  bestEl.textContent=best;
}
function slideLine(line){
  const a=line.filter(Boolean),out=[];let gained=0;
  for(let i=0;i<a.length;i++){
    if(a[i+1]&&a[i].v===a[i+1].v){
      const v=a[i].v*2;gained+=v;
      out.push({id:a[i].id,v,merged:true,absorb:a[i+1].id});i++;
    }else out.push(a[i]);
  }
  while(out.length<N)out.push(null);
  return {line:out,gained};
}
function move(dir){ // 0 влево,1 вверх,2 вправо,3 вниз
  if(over)return;
  let moved=false,gained=0;const gone=[];
  for(let i=0;i<N;i++){
    const line=[];
    for(let j=0;j<N;j++){const [r,c]=pos(dir,i,j);line.push(grid[r][c])}
    const res=slideLine(line);gained+=res.gained;
    for(let j=0;j<N;j++){
      const [r,c]=pos(dir,i,j),t=res.line[j];
      if(grid[r][c]!==t)moved=true;
      grid[r][c]=t;
      if(t&&t.absorb){gone.push({id:t.absorb,r,c});t.absorb=0}
    }
  }
  if(!moved)return;
  score+=gained;
  const g=geo();
  // поглощённая плитка скользит на место слияния и исчезает
  gone.forEach(({id,r,c})=>{
    const el=els.get(id);els.delete(id);if(!el)return;
    el.style.zIndex=0;el.style.left=g.x(c)+'px';el.style.top=g.y(r)+'px';
    setTimeout(()=>el.remove(),130);
  });
  // слитая плитка меняет значение в конце скольжения и «подпрыгивает»
  grid.flat().forEach(t=>{
    if(t&&t.merged){
      t.merged=false;
      setTimeout(()=>{const el=els.get(t.id);if(el){styleEl(el,t.v,geo().z);el.classList.add('merged')}},120);
    }
  });
  addTile();render();check();
}
function pos(dir,i,j){
  switch(dir){
    case 0:return [i,j];
    case 2:return [i,N-1-j];
    case 1:return [j,i];
    default:return [N-1-j,i];
  }
}
function canMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t=grid[r][c];if(!t)return true;
    if(c<N-1&&grid[r][c+1]&&t.v===grid[r][c+1].v)return true;
    if(r<N-1&&grid[r+1][c]&&t.v===grid[r+1][c].v)return true;
  }
  return false;
}
function check(){
  if(!keepGoing&&grid.flat().some(t=>t&&t.v===2048)){
    won=true;keepGoing=true;
    msgText.textContent='Вы выиграли!';reviveBtn.style.display='none';err.textContent='';msg.classList.add('show');
  }else if(!canMove()){
    over=true;showOver();
  }
}
document.addEventListener('keydown',e=>{
  const k={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3,ф:0,ц:1,в:2,ы:3}[e.key];
  if(k!==undefined){e.preventDefault();move(k)}
});
let sx,sy;
boardEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
boardEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0);else move(dy>0?3:1);
},{passive:true});
document.getElementById('restart').onclick=()=>{submitScore();init()};
document.getElementById('again').onclick=()=>{
  if(won&&!over){msg.classList.remove('show')}else init();
};
/* ===== Оплата возрождения через huEVO (проверка делает сервер) ===== */
const reviveBtn=document.getElementById('revive'),err=document.getElementById('err');
let token=null,loginErr='';
async function api(url,opt={}){
  opt.headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};
  const r=await fetch(url,opt);return r.json();
}
// Вход: сервер проверяет подпись hu_* из адреса фрейма
(async()=>{
  try{await huevo.init()}
  catch(e){loginErr=(e&&e.code==='not_embedded')||typeof huevo==='undefined'?'Оплата доступна только внутри huEVO':'Не удалось связаться с huEVO ('+((e&&e.code)||e)+')';return}
  try{
    const j=await api('/api/login',{method:'POST',body:JSON.stringify({query:location.search})});
    if(j.ok)token=j.token;
    else loginErr='Сервер отклонил вход: проверьте CLIENT_SECRET и CLIENT_ID на Render';
  }catch(e){loginErr='Сервер игры не ответил, попробуйте через минуту'}
})();
function submitScore(){
  if(token&&score>0)api('/api/score',{method:'POST',body:JSON.stringify({score})}).catch(()=>{});
}
const lbPanel=document.getElementById('lbPanel'),lbList=document.getElementById('lbList');
async function loadLb(){
  lbList.textContent='Загрузка…';
  try{
    const j=await api('/api/leaderboard');
    lbList.textContent='';
    if(!j.top.length){lbList.textContent='Пока никого нет. Будьте первым!';return}
    const add=(txt,val,me)=>{
      const li=document.createElement('li');if(me)li.className='me';
      const a=document.createElement('span');a.textContent=txt;
      const b=document.createElement('b');b.textContent=val;
      li.append(a,b);lbList.appendChild(li);
    };
    j.top.forEach((e,i)=>add((i+1)+'. '+e.name,e.score,e.me));
    if(j.mine&&j.mine.rank>j.top.length)add('Вы: '+j.mine.rank+' место',j.mine.score,true);
  }catch(e){lbList.textContent='Не удалось загрузить таблицу'}
}
document.getElementById('lb').onclick=()=>{lbPanel.classList.add('show');loadLb()};
document.getElementById('lbClose').onclick=()=>lbPanel.classList.remove('show');
function showOver(){
  submitScore();
  msgText.textContent='Игра окончена';
  reviveBtn.style.display='';reviveBtn.disabled=false;err.textContent='';
  msg.classList.add('show');
}
function applyRevive(){
  const t=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c])t.push([grid[r][c],r,c]);
  t.sort((x,y)=>x[0].v-y[0].v).slice(0,4).forEach(([tile,r,c])=>{
    grid[r][c]=null;const el=els.get(tile.id);if(el)el.remove();els.delete(tile.id);
  });
  over=false;msg.classList.remove('show');render();
}
reviveBtn.onclick=async()=>{
  err.textContent='';
  if(!token){err.textContent=loginErr||'Вход ещё выполняется, подождите секунду';return}
  reviveBtn.disabled=true;
  try{
    const s=await api('/api/revive/start',{method:'POST'});
    if(!s.ok)throw new Error('start');
    huevo.confirmPayment(s.intent_id).catch(()=>{}); // итог всё равно узнаём на сервере
    err.textContent='Подтвердите оплату в окне huEVO';
    for(let i=0;i<180;i++){
      await new Promise(r=>setTimeout(r,2000));
      const st=await api('/api/revive/status?intent_id='+encodeURIComponent(s.intent_id));
      if(st.status==='succeeded'&&st.granted){applyRevive();return}
      if(st.status==='cancelled'||st.status==='expired'){err.textContent='Оплата отменена';break}
      if(st.status==='failed'){err.textContent=st.error==='insufficient_funds'?'Не хватает монэток':'Оплата не прошла';break}
      if(st.status==='used'||st.ok===false)break;
    }
  }catch(e){err.textContent='Ошибка оплаты, попробуйте ещё раз'}
  reviveBtn.disabled=false;
};
window.addEventListener('resize',render);
init();
</script>
</body>
</html>
